<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva contraseña — Constellation Nexia</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#050508;
  --card:#12121E;
  --accent:#A855F7;
  --accent-rgb:168,85,247;
  --text:#FFFFFF;
  --muted:#A0A0B0;
  --line:#1E1E2E;
  --font-title:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:32px 16px}
h1,h2,h3{font-family:var(--font-title);line-height:1.2}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--font-title);font-weight:700;font-size:1.15rem;margin-bottom:28px;text-decoration:none;color:var(--text)}
.logo .star{color:var(--accent)}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:28px 24px}
.card h3{font-size:1.15rem;margin-bottom:6px}
.card p.sub{color:var(--muted);font-size:.86rem;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.field input{width:100%;background:#0b0b12;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--text);font-family:var(--font-body);font-size:.9rem;outline:none;transition:border-color .3s}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.12)}
.btn{display:block;width:100%;text-align:center;padding:13px 20px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;font-family:var(--font-body);background:var(--accent);color:#1a0330;margin-top:6px}
.btn:disabled{opacity:.6;cursor:default}
.msg-ok{color:#7CFFB2;font-size:.84rem;margin-top:10px}
.msg-err{color:#FF8A8A;font-size:.84rem;margin-top:10px}
.status-box{text-align:center;padding:20px 0}
.status-icon{font-size:2.4rem;display:block;margin-bottom:10px}
</style>
</head>
<body>

<a href="https://constellationnexia.com" class="logo"><span class="star">✦</span> Constellation Nexia</a>

<div class="card" id="card">
  <h3>Crea tu nueva contraseña</h3>
  <p class="sub">Escribe la contraseña que quieres usar de ahora en adelante.</p>
  <form id="reset-form">
    <div class="field"><label for="new-pass">Nueva contraseña</label><input type="password" id="new-pass" placeholder="Mínimo 6 caracteres" minlength="6" required></div>
    <div class="field"><label for="new-pass2">Repite la contraseña</label><input type="password" id="new-pass2" placeholder="Mínimo 6 caracteres" minlength="6" required></div>
    <button type="submit" class="btn">Guardar nueva contraseña →</button>
    <p id="reset-err" class="msg-err" style="display:none"></p>
    <p id="reset-ok" class="msg-ok" style="display:none">✓ Contraseña actualizada. Redirigiendo...</p>
  </form>
</div>

<script>
const SUPA_URL = 'https://pltngimvnejhkpsdauue.supabase.co';
const SUPA_KEY = 'sb_publishable_Zr_9mDOwKDeeZSdYOM6LAg_jhfovS4f';
const db = window.supabase.createClient(SUPA_URL, SUPA_KEY);

const card = document.getElementById('card');

// Supabase detecta el token de recuperación en el hash de la URL solo.
// Si por algún motivo no hay sesión activa (link vencido, ya usado, o
// se abrió esta página directamente sin venir del correo), avisamos.
db.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    // Sesión de recuperación lista — el formulario ya puede usarse.
  }
});

setTimeout(async () => {
  const { data: { session } } = await db.auth.getSession();
  if (!session) {
    card.innerHTML = `
      <div class="status-box">
        <span class="status-icon">⚠️</span>
        <h3>Link inválido o vencido</h3>
        <p class="sub" style="margin-top:8px">Pide un nuevo link de recuperación desde la página de inicio de sesión.</p>
      </div>`;
  }
}, 1200);

document.getElementById('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pass1 = document.getElementById('new-pass').value;
  const pass2 = document.getElementById('new-pass2').value;
  const errEl = document.getElementById('reset-err');
  const okEl = document.getElementById('reset-ok');
  const btn = e.target.querySelector('button[type=submit]');
  errEl.style.display = 'none';
  okEl.style.display = 'none';

  if (pass1 !== pass2) {
    errEl.textContent = 'Las contraseñas no coinciden.';
    errEl.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Guardando...';

  try {
    const { error } = await db.auth.updateUser({ password: pass1 });
    if (error) {
      errEl.textContent = 'No pudimos actualizar tu contraseña. Pide un nuevo link e intenta de nuevo.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Guardar nueva contraseña →';
      return;
    }
    okEl.style.display = 'block';
    setTimeout(() => { window.location.href = 'index.html?login=1'; }, 1800);
  } catch (err) {
    console.error('Error actualizando contraseña:', err);
    errEl.textContent = 'Error al conectar. Intenta de nuevo.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Guardar nueva contraseña →';
  }
});
</script>

</body>
</html>
